name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: "AgriWorld 3D"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_HOME: /root/android-sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          mkdir -p $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          # Install the exact build tools version required by Godot 4.3
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.2" "platforms;android-33"

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Godot Import
        run: |
          mkdir -v -p ~/.local/share/godot
          mv /root/.local/share/godot/export_templates/ ~/.local/share/godot/ 2>/dev/null || true
          godot --headless --import

      - name: Configure Godot Editor Settings
        run: |
          # Use sed to update the settings file, as the image does not read it automatically
          GODOT_CFG=$(ls ~/.config/godot/editor_settings-*.tres)
          sed -i -e "s:\(^.*java_sdk_path\)\s*=.*$:\1 = \"$JAVA_HOME\":" $GODOT_CFG
          sed -i -e "s:\(^.*android_sdk_path\)\s*=.*$:\1 = \"$ANDROID_HOME\":" $GODOT_CFG

      - name: Export APK
        run: |
          mkdir -v -p build/android
          # Use --export-release to reduce APK size (not debug)
          godot --headless --export-release "Android" build/android/AgriWorld.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agriworld-apk
          path: build/android/AgriWorld.apk
