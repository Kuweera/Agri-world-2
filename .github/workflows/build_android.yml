name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          mkdir -p $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.2" "platforms;android-33"

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Godot Import
        run: |
          mkdir -v -p ~/.local/share/godot
          mv /root/.local/share/godot/export_templates/ ~/.local/share/godot/ 2>/dev/null || true
          godot --headless --import

      - name: Create and Configure Godot Editor Settings
        run: |
          # 1. Create the directory and the settings file
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/root/android-sdk"
          EOF
          
          # 2. Copy it to the root user's config location as well
          mkdir -p /root/.config/godot
          cp ~/.config/godot/editor_settings-4.tres /root/.config/godot/editor_settings-4.tres

      - name: Export APK
        env:
          ANDROID_HOME: /root/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
        run: |
          mkdir -v -p build/android
          godot --headless --export-debug "Android" build/android/AgriWorld.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agriworld-apk
          path: build/android/AgriWorld.apk
