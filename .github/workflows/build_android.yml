name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: "AgriWorld 3D"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_HOME: /root/android-sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          mkdir -p $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.2" "platforms;android-33"

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Godot Import
        run: |
          mkdir -v -p ~/.local/share/godot
          mv /root/.local/share/godot/export_templates/ ~/.local/share/godot/ 2>/dev/null || true
          godot --headless --import

      - name: Configure Godot Editor Settings
        run: |
          GODOT_CFG=~/.config/godot/editor_settings-4.tres
          mkdir -p ~/.config/godot
          # Create the file if it doesn't exist
          touch $GODOT_CFG
          # Use sed to insert or update the paths
          sed -i "s|export/android/java_sdk_path=.*|export/android/java_sdk_path=\"${JAVA_HOME}\"|" $GODOT_CFG
          sed -i "s|export/android/android_sdk_path=.*|export/android/android_sdk_path=\"${ANDROID_HOME}\"|" $GODOT_CFG
          # If the lines don't exist, append them
          grep -q "java_sdk_path" $GODOT_CFG || echo "export/android/java_sdk_path = \"${JAVA_HOME}\"" >> $GODOT_CFG
          grep -q "android_sdk_path" $GODOT_CFG || echo "export/android/android_sdk_path = \"${ANDROID_HOME}\"" >> $GODOT_CFG

      - name: Export APK
        run: |
          mkdir -v -p build/android
          godot --headless --export-debug "Android" build/android/AgriWorld.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agriworld-apk
          path: build/android/AgriWorld.apk
