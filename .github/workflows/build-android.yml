name: Build AgriWorld 3D Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AgriWorld3D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriWorld3D-debug-apk
          path: build/AgriWorld3D-debug.apk
          if-no-files-found: error
